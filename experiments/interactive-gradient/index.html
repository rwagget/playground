<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Gradient · Playground</title>
  <style>
    body { margin:0; height:100vh; background:#000; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    // Drawn at full device resolution, then dithered with fine noise so the gradients don't band.
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // Design space: 626 × 417, stretched to fill the window.
    const W = 626, H = 417;

    // Glowing edge: sweeps down from the left, dips, and rises up the right side.
    const EDGE = [[-10, 70], [30, 170, 110, 245, 240, 272], [370, 299, 390, 322, 465, 322],
                  [540, 322, 565, 285, 595, 200], [625, 115, 615, 120, 640, 60]];
    // Faint secondary ridge below the edge.
    const RIDGE = [[160, 318], [260, 300, 380, 342, 470, 342], [560, 342, 575, 300, 612, 160]];

    function path(points, sx, sy, close) {
      const p = new Path2D();
      const [[x0, y0], ...curves] = points;
      p.moveTo(x0 * sx, y0 * sy);
      for (const c of curves) p.bezierCurveTo(c[0] * sx, c[1] * sy, c[2] * sx, c[3] * sy, c[4] * sx, c[5] * sy);
      if (close) { p.lineTo(660 * sx, -40 * sy); p.lineTo(-40 * sx, -40 * sy); p.closePath(); }
      return p;
    }

    function radial(cx, cy, r, stops) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      for (const [o, c] of stops) g.addColorStop(o, c);
      return g;
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
      canvas.width = cw; canvas.height = ch;
      const sx = innerWidth / W, sy = innerHeight / H;
      const u = Math.sqrt(sx * sy); // stroke/blur scale

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      // Colored light above the edge
      ctx.save();
      ctx.clip(path(EDGE, sx, sy, true));
      ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
      const base = ctx.createLinearGradient(0, 0, 0, 330);
      [[0, '#04041a'], [.35, '#1c1a9c'], [.6, '#5512b8'], [.82, '#c8165e'], [1, '#ff4a26']]
        .forEach(([o, c]) => base.addColorStop(o, c));
      const layers = [
        base,
        radial(330, 140, 210, [[0, 'rgba(59,58,230,.7)'], [1, 'rgba(59,58,230,0)']]),
        radial(30, 210, 230, [[0, 'rgba(255,26,46,.95)'], [.6, 'rgba(208,16,74,.45)'], [1, 'rgba(208,16,74,0)']]),
        radial(0, 0, 190, [[.2, '#000'], [1, 'rgba(0,0,0,0)']]),
        radial(626, 0, 230, [[.15, 'rgba(0,0,0,.95)'], [1, 'rgba(0,0,0,0)']]),
      ];
      for (const fill of layers) { ctx.fillStyle = fill; ctx.fillRect(-40, -40, 720, 500); }
      ctx.restore();

      // Strokes in screen space so line widths stay even when stretched
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      const stroke = (p, color, width, blur, alpha = 1) => {
        ctx.filter = blur ? `blur(${blur}px)` : 'none';
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke(p);
      };
      const edge = path(EDGE, sx, sy), ridge = path(RIDGE, sx, sy);
      stroke(ridge, '#6a2412', 6 * u, 6 * u, .5);
      stroke(edge, '#ff4a10', 16 * u, 10 * u, .75);  // wide halo
      stroke(edge, '#ff7a1c', 5 * u, 2.5 * u, .9);   // inner glow
      stroke(edge, '#ffa040', 2 * u, 0);             // crisp core
      stroke(edge, '#ffe0a0', .6 * u, 0, .7);        // hot center
      ctx.filter = 'none';
      ctx.globalAlpha = 1;

      // Dither: a few levels of monochrome noise per pixel breaks up 8-bit banding
      const img = ctx.getImageData(0, 0, cw, ch);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - .5) * 10;
        d[i] += n; d[i + 1] += n; d[i + 2] += n;
      }
      ctx.putImageData(img, 0, 0);
    }

    let pending = 0;
    addEventListener('resize', () => {
      cancelAnimationFrame(pending);
      pending = requestAnimationFrame(draw);
    });
    draw();
  </script>
</body>
</html>
