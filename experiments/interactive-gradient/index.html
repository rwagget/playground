<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Gradient · Playground</title>
  <style>
    body { margin:0; height:100vh; overflow:hidden; font-family:system-ui, sans-serif; background:#111; touch-action:none; }
    #bg { position:fixed; inset:0; }
    .back { position:fixed; top:16px; left:16px; color:#fff; mix-blend-mode:difference; text-decoration:none; font-size:14px; z-index:1; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <a class="back" href="../../">← Playground</a>
  <script>
    const bg = document.getElementById('bg');
    const target = { x: .5, y: .5 }, cur = { x: .5, y: .5 };
    addEventListener('pointermove', e => { target.x = e.clientX / innerWidth; target.y = e.clientY / innerHeight; });
    function frame(t) {
      cur.x += (target.x - cur.x) * .08;
      cur.y += (target.y - cur.y) * .08;
      const hue = (t / 40 + cur.x * 180) % 360;
      bg.style.background =
        `radial-gradient(circle at ${cur.x * 100}% ${cur.y * 100}%, hsl(${hue} 90% 65%), transparent 55%),` +
        `radial-gradient(circle at ${(1 - cur.x) * 100}% ${(1 - cur.y) * 100}%, hsl(${hue + 120} 85% 55%), transparent 60%),` +
        `linear-gradient(${cur.x * 360}deg, hsl(${hue + 240} 70% 25%), hsl(${hue + 60} 70% 20%))`;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
