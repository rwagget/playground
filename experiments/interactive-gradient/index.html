<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Gradient · Playground</title>
  <style>
    body { margin:0; height:100vh; background:#0b0b0e; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    // A glowing ribbon of colour flowing left to right. The cursor acts like a rock in a stream:
    // the ribbon's streamlines bend around it (potential flow past a cylinder) and leave a wake.
    // All units are fractions of the window height.
    const RIBBON = 0.055;  // half-height of the ribbon
    const ROCK = 0.06;    // radius of the cursor's "rock"

    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2', { antialias: false });

    const vert = `#version 300 es
      in vec2 pos;
      void main() { gl_Position = vec4(pos, 0., 1.); }`;

    const frag = `#version 300 es
      precision highp float;
      uniform vec2 uRes;
      uniform float uTime;
      uniform vec3 uRock;   // x, y, radius
      out vec4 outColor;

      const float H = ${RIBBON.toFixed(4)};
      const float U = .06;  // flow speed
      const vec3 BG = vec3(.043, .043, .055);  // off-black

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                   mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0., a = .5;
        for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= .5; }
        return v;
      }

      // navy → blue → violet → magenta → red-orange
      vec3 palette(float n) {
        n = clamp(n, 0., 1.) * 4.;
        vec3 c0 = vec3(.06, .06, .40), c1 = vec3(.16, .16, .82), c2 = vec3(.40, .08, .74),
             c3 = vec3(.82, .09, .40), c4 = vec3(1., .30, .15);
        if (n < 1.) return mix(c0, c1, n);
        if (n < 2.) return mix(c1, c2, n - 1.);
        if (n < 3.) return mix(c2, c3, n - 2.);
        return mix(c3, c4, n - 3.);
      }

      void main() {
        float px = 1. / uRes.y;
        vec2 p = gl_FragCoord.xy * px - vec2(0., .5);
        float t = uTime;

        // s = distance along the flow, v = which streamline (0 = ribbon centre)
        float s = p.x, v = p.y;
        float a = uRock.z;
        vec2 rock = vec2(uRock.x, uRock.y - .5);
        vec2 d = p - rock;
        float r = length(d);
        if (a > .001) {
          // Influence fades out quickly beyond the circle so the ribbon snaps back to straight
          float k = r > a ? a * a / (r * r) * (1. - smoothstep(a, a * 2.5, r)) : 1.;
          v = rock.y + d.y * (1. - k);   // stream function
          s = rock.x + d.x * (1. + k);   // velocity potential
          // Wake: a wobble that travels downstream and fades out
          float wake = smoothstep(0., a, d.x) * exp(-d.x / (a * 3.)) * exp(-d.y * d.y / (a * a * 2.5));
          float phase = (d.x - t * U * 3.) / a;
          v += wake * a * (.45 * sin(phase * 2.2) + 1.1 * (fbm(vec2(phase * .8, d.y / a)) - .5));
          s += wake * a * .8 * (fbm(vec2(phase * .6 + 3.1, d.y / a + 7.3)) - .5);  // churns the colours
        }

        // Gentle current: domain-warped noise drifting left to right
        vec2 q = vec2(s - t * U, v * .11 / H);
        vec2 w = vec2(fbm(q * vec2(2., 5.) + vec2(0., t * .05)),
                      fbm(q * vec2(2., 5.) + vec2(5.2, -t * .04)));
        float n = fbm(q * vec2(1.6, 4.) + (w - .5) * 1.2);
        float edgeDist = abs(v) / H;
        vec3 fill = palette(n * .85 + edgeDist * edgeDist * .45 - .1);
        fill *= .85 + .3 * fbm(q * vec2(3., 8.) + w * 2. + t * .03);

        // Ribbon body with crisp edges
        float e = abs(v) - H;
        float fw = max(fwidth(e), px * .5);
        float inside = 1. - smoothstep(-fw, fw, e);
        vec3 col = mix(BG, fill, inside);
        col = mix(col, vec3(1., .35, .15), inside * exp(min(e, 0.) / .018) * .5);

        // Light spilling into the background: the ribbon's own colours, then a warm orange halo
        float out_ = max(e, 0.);
        // (glow colour is sampled along the ribbon so it matches the colours flowing past)
        vec3 spill = palette(fbm(vec2(s - t * U, 0.) * vec2(1.6, 4.)) * .85 + .15);
        col += spill * (exp(-out_ / .2) * .32 + exp(-out_ / .5) * .1) * (1. - inside);
        col += vec3(1., .29, .06) * (exp(-abs(e) / .02) * .5 + exp(-out_ / .12) * .24);

        // Glowing orange edges: sharp core, hot centre
        float width = max(.003, fw);
        col += vec3(1., .55, .20) * exp(-pow(e / width, 2.)) * .9;
        col += vec3(1., .88, .60) * exp(-pow(e / (width * .45), 2.)) * .6;

        // The rock: a faint, dim lens with a thin ring
        if (a > .001) {
          float m = smoothstep(a - px * 1.5, a, r);
          col = mix(BG + col * .2, col, m);
          col += vec3(1., .9, .85) * exp(-pow((r - a) / (px * 1.2), 2.)) * .1;
        }

        // Fine grain dithers away banding
        col += (hash(gl_FragCoord.xy) - .5) * 6. / 255.;
        outColor = vec4(col, 1.);
      }`;

    function compile(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    // One triangle covering the screen
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uTime = gl.getUniformLocation(prog, 'uTime');
    const uRock = gl.getUniformLocation(prog, 'uRock');

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    addEventListener('resize', resize);
    resize();

    // Pointer → rock. The rock is always on the page: it starts in the middle of the ribbon,
    // follows the pointer, and stays where the pointer last was.
    const target = { x: 0, y: 0.5, moved: false };
    const rock = { x: 0, y: 0.5, r: 0 };
    const track = e => {
      target.x = e.clientX / innerHeight;
      target.y = 1 - e.clientY / innerHeight;
      target.moved = true;
    };
    canvas.addEventListener('pointermove', track);
    canvas.addEventListener('pointerdown', track);

    function frame(ms) {
      if (!target.moved && innerHeight > 0) rock.x = target.x = innerWidth / innerHeight / 2;
      rock.x += (target.x - rock.x) * 0.3;
      rock.y += (target.y - rock.y) * 0.3;
      rock.r += (ROCK - rock.r) * 0.08;

      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, ms / 1000);
      gl.uniform3f(uRock, rock.x, rock.y, rock.r);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
