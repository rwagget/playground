<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metallic Shader · Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
      background: #111;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .card {
      width: min(478px, 100%);
      padding: 28px 26px;
      background: #1c1c1c;
      border: 1.5px solid #2b2b2b;
      border-radius: 22px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .03),
        0 24px 60px rgba(0, 0, 0, .55);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 36px;
      font-weight: 500;
      color: #f2f2f2;
    }
    .note {
      margin: 8px 0 0;
      font-size: 20px;
      line-height: 28px;
      color: #9b9b9b;
    }

    .ends {
      display: flex;
      justify-content: space-between;
      margin-top: 32px;
      font-size: 27px;
      line-height: 34px;
      color: #9c9c9c;
    }

    .track {
      position: relative;
      height: 43px;
      margin-top: 22px;
      cursor: pointer;
      touch-action: none;
    }
    .rail {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #2b2b2b;
      border-radius: 14px;
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 14px;
      background: linear-gradient(90deg, #3a2a37, #a067a4);
    }
    .chrome {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .has-chrome .chrome { display: block; }
    .has-chrome .fill { display: none; }
    .stop {
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 3px;
      background: #8b8b8b;
      transition: background .2s;
    }
    .stop.on {
      background: rgba(255, 255, 255, .5);
      box-shadow: 0 0 0 1px rgba(40, 10, 40, .25);
    }
    .stop.current {
      background: #fff;
      box-shadow: 0 0 0 1.5px rgba(40, 10, 40, .4);
    }

    .thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      border-radius: 50%;
      outline: none;
      cursor: grab;
    }
    .thumb:focus-visible::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #0a84ff;
    }
    .dragging .thumb { cursor: grabbing; }

    @media (max-width: 420px) {
      h1 { font-size: 24px; line-height: 32px; }
      .note { font-size: 17px; line-height: 24px; }
      .ends { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reasoning effort</h1>
    <p class="note">Higher effort can improve complex answers, but takes longer.</p>

    <div class="ends">
      <span>Faster</span>
      <span>Smarter</span>
    </div>

    <div class="track" id="track">
      <div class="rail">
        <div class="fill" id="fill"></div>
        <canvas class="chrome" id="chrome"></canvas>
      </div>
      <div class="thumb" id="thumb" role="slider" tabindex="0" aria-label="Effort" aria-valuemin="0"></div>
    </div>

  </div>

  <script>
    const LEVELS = ['Low', 'Medium', 'High', 'Extra high', 'Ultra', 'Max'];
    const EDGE = 24; // distance from the rail's ends to the first and last stop

    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const thumb = document.getElementById('thumb');

    thumb.setAttribute('aria-valuemax', LEVELS.length - 1);

    const stops = LEVELS.map(() => {
      const el = document.createElement('span');
      el.className = 'stop';
      track.querySelector('.rail').append(el);
      return el;
    });

    let width = 0;
    const stopX = i => EDGE + i * (width - 2 * EDGE) / (LEVELS.length - 1);
    const nearest = x => Math.max(0, Math.min(LEVELS.length - 1,
      Math.round((x - EDGE) / ((width - 2 * EDGE) / (LEVELS.length - 1)))));

    let value = 2;
    let x = 0, v = 0, target = 0;
    let dragging = false;
    let raf = 0;

    function setLevel(i) {
      value = i;
      thumb.setAttribute('aria-valuenow', i);
      thumb.setAttribute('aria-valuetext', LEVELS[i]);
    }

    function render() {
      // The fill runs just past the thumb so its rounded end wraps the current stop
      fill.style.width = `${x + 18}px`;
      thumb.style.transform = `translateX(${x}px)`;
      const at = nearest(x);
      stops.forEach((el, i) => {
        el.classList.toggle('current', i === at);
        el.classList.toggle('on', i !== at && stopX(i) < x);
      });
    }

    // Spring toward the target: stiff while dragging, bouncy when settling on a stop
    let last = 0;
    function tick(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      const k = dragging ? 900 : 380;
      const c = 2 * Math.sqrt(k) * (dragging ? 1 : 0.5);
      for (let s = 0; s < 4; s++) {
        const h = dt / 4;
        v += (k * (target - x) - c * v) * h;
        x += v * h;
      }
      render();
      if (dragging || Math.abs(target - x) > 0.05 || Math.abs(v) > 0.5) {
        raf = requestAnimationFrame(tick);
      } else {
        x = target; v = 0; raf = 0;
        render();
      }
    }
    function animate() {
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    }

    function goTo(i) {
      setLevel(i);
      target = stopX(i);
      animate();
    }

    function pointerX(e) {
      const r = track.getBoundingClientRect();
      return Math.max(EDGE, Math.min(width - EDGE, e.clientX - r.left));
    }

    track.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      track.setPointerCapture(e.pointerId);
      dragging = true;
      track.classList.add('dragging');
      thumb.focus({ preventScroll: true, focusVisible: false });
      target = pointerX(e);
      setLevel(nearest(target));
      animate();
    });
    track.addEventListener('pointermove', e => {
      if (!dragging) return;
      target = pointerX(e);
      setLevel(nearest(target));
    });
    const release = () => {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('dragging');
      goTo(nearest(target));
    };
    track.addEventListener('pointerup', release);
    track.addEventListener('pointercancel', release);

    thumb.addEventListener('keydown', e => {
      const keys = {
        ArrowRight: value + 1, ArrowUp: value + 1,
        ArrowLeft: value - 1, ArrowDown: value - 1,
        Home: 0, End: LEVELS.length - 1,
      };
      if (!(e.key in keys)) return;
      e.preventDefault();
      goTo(Math.max(0, Math.min(LEVELS.length - 1, keys[e.key])));
    });

    // Liquid chrome fill: a WebGL pass that draws the fill's rounded shape with a bevelled
    // rim and rolling reflections, tinted plum to pink. Falls back to the CSS gradient.
    const canvas = document.getElementById('chrome');
    const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: true });

    if (gl) {
      const vert = `#version 300 es
        in vec2 a;
        void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

      const frag = `#version 300 es
        precision highp float;
        uniform vec2 uSize;    // rail size, CSS px
        uniform float uDpr;
        uniform float uWidth;  // fill width, CSS px
        uniform float uTime;
        uniform float uFlow;   // horizontal drift, pushed along by dragging
        out vec4 o;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                     mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 3; i++) {
            v += a * noise(p);
            p = p * 2.03 + vec2(1.7, 9.2);
            a *= 0.4;
          }
          return v;
        }
        float sdRect(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + r;
          return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        }

        void main() {
          vec2 p = vec2(gl_FragCoord.x, uSize.y * uDpr - gl_FragCoord.y) / uDpr;
          vec2 hs = vec2(uWidth, uSize.y) * 0.5;
          vec2 c = p - hs;
          const float R = 14.0;
          float d = sdRect(c, hs, R);
          if (d > 1.0) { o = vec4(0.0); return; }

          // Outward normal of the outline; the surface curves down over a bevel near the edge
          vec2 e = vec2(0.5, 0.0);
          vec2 g = vec2(sdRect(c + e.xy, hs, R) - sdRect(c - e.xy, hs, R),
                        sdRect(c + e.yx, hs, R) - sdRect(c - e.yx, hs, R));
          g /= max(length(g), 1e-4);
          float inside = -d;
          float bevel = 1.0 - smoothstep(0.0, 10.0, inside);
          vec3 n = normalize(vec3(g * bevel * 1.8, 1.0));

          // Folding liquid streaming left to right: uFlow carries the whole surface along,
          // and every warp layer also creeps rightward (at its own pace) so it churns as it goes
          vec2 q = vec2(p.x + uFlow, p.y) / 70.0;
          float t = uTime * 0.18;
          vec2 w = vec2(fbm(q * vec2(0.4, 1.0) + vec2(-1.1 * t, -0.6 * t)),
                        fbm(q * vec2(0.4, 1.0) + vec2(4.1 - 0.7 * t, 2.3 + 0.4 * t)));
          float f = fbm(q * vec2(0.35, 1.0) + 1.3 * w + vec2(-0.4 * t, 0.0));

          // Treat that as a height field and look up a banded "studio" reflection
          float s = f * 3.0 + q.x * 0.6 + q.y * 0.8 + n.x * 0.8 + n.y * 1.4;
          float band = sin(s * 5.0);
          float v = smoothstep(-0.6, 0.55, band);
          v = v * v * (3.0 - 2.0 * v);
          float glint = pow(max(0.0, sin(s * 5.0 + 1.1)), 40.0);

          vec3 dark  = vec3(0.09, 0.03, 0.09);
          vec3 mid   = vec3(0.62, 0.31, 0.63);
          vec3 light = vec3(1.00, 0.84, 0.96);
          vec3 col = mix(dark, mid, smoothstep(0.0, 0.55, v));
          col = mix(col, light, smoothstep(0.55, 1.0, v));
          col += glint * vec3(1.0, 0.92, 0.98) * 0.9;

          // Light from above: top bevel catches it, bottom falls into shadow
          col *= 1.0 - g.y * bevel * 0.45;
          // Bright rim right at the edge, then a thin dark contour just inside it
          col *= 1.0 - 0.3 * exp(-pow((inside - 3.4) / 1.3, 2.0));
          col = mix(col, vec3(1.0, 0.9, 0.97), smoothstep(2.0, 0.4, inside) * 0.65);
          // Dimmer toward the Faster end, like the old gradient
          col *= mix(0.55, 1.0, smoothstep(0.0, uWidth, p.x));

          float alpha = clamp(0.5 - d, 0.0, 1.0);
          o = vec4(col * alpha, alpha);
        }`;

      const compile = (type, src) => {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        return sh;
      };
      try {
        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        const u = name => gl.getUniformLocation(prog, name);
        const uSize = u('uSize'), uDpr = u('uDpr'), uWidth = u('uWidth'), uTime = u('uTime'), uFlow = u('uFlow');
        const calm = matchMedia('(prefers-reduced-motion: reduce)');

        let flow = 0, prev = performance.now(), time = 0;
        const drawChrome = now => {
          const dt = Math.min((now - prev) / 1000, 1 / 20);
          prev = now;
          const pace = dt * (calm.matches ? 0.15 : 1);
          time += pace;
          flow -= 34 * pace;      // steady current toward the Smarter end
          flow -= v * dt * 0.45;  // dragging shoves the liquid along

          const dpr = Math.min(devicePixelRatio || 1, 2);
          const w = canvas.clientWidth, h = canvas.clientHeight;
          if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
          }
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(uSize, w, h);
          gl.uniform1f(uDpr, dpr);
          gl.uniform1f(uWidth, Math.min(x + 18, w));
          gl.uniform1f(uTime, time);
          gl.uniform1f(uFlow, flow);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
        track.querySelector('.rail').classList.add('has-chrome');
        const loop = now => { drawChrome(now); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      } catch (err) {
        console.warn('Chrome fill unavailable, using gradient', err);
      }
    }

    function layout() {
      width = track.clientWidth;
      stops.forEach((el, i) => { el.style.left = `${stopX(i)}px`; });
      x = target = stopX(value);
      v = 0;
      render();
    }
    new ResizeObserver(layout).observe(track);
    setLevel(value);
    layout();
  </script>
</body>
</html>
