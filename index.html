<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <style>
    :root { --bg:#f6f5f2; --fg:#1a1a1a; --muted:#6b6b6b; --card:#fff; --line:#e4e2dc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1a1a1a; --line:#2a2a2a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    main { max-width:960px; margin:0 auto; padding:64px 16px; }
    h1 { font-size:40px; margin:0 0 4px; letter-spacing:-0.02em; }
    .sub { color:var(--muted); margin:0 0 40px; }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
    a.card { display:block; padding:20px; background:var(--card); border:1px solid var(--line);
      border-radius:12px; color:inherit; text-decoration:none; transition:transform .15s, border-color .15s; }
    a.card:hover { transform:translateY(-2px); border-color:var(--muted); }
    .card h2 { font-size:18px; margin:0 0 6px; }
    .card p { margin:0 0 12px; color:var(--muted); font-size:14px; }
    .card time { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Playground</h1>
    <p class="sub">Small experiments and sketches.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    fetch('experiments.json')
      .then(r => r.json())
      .then(list => {
        list.sort((a, b) => b.date.localeCompare(a.date));
        const grid = document.getElementById('grid');
        for (const e of list) {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = `experiments/${e.slug}/`;
          a.innerHTML = `<h2></h2><p></p><time></time>`;
          a.querySelector('h2').textContent = e.title;
          a.querySelector('p').textContent = e.description;
          a.querySelector('time').textContent = e.date;
          grid.append(a);
        }
      });
  </script>
</body>
</html>
